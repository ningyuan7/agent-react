<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReAct Lab · Agent 工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><span class="logo">↗</span> ReAct Lab</div><p class="muted">把问题交给行动</p><button id="new" class="new">＋ 新建会话</button><h2>最近会话</h2><nav id="sessions" aria-label="会话列表"></nav><div class="side-note"><span class="dot"></span> Python Runtime<p>独立上下文 · 本地保存</p></div></aside><main><header><div><strong id="title">新的工作会话</strong><div id="session-id" class="muted"></div></div><span id="mode" class="badge">连接中</span></header><section id="messages" aria-live="polite"></section><footer><div id="error" role="alert" hidden></div><form id="composer"><label for="input" class="sr-only">你的任务</label><textarea id="input" rows="3" maxlength="4000" placeholder="描述你的任务，或继续追问…"></textarea><div class="compose-bottom"><span id="status" role="status">准备就绪</span><button id="send" type="submit" disabled>发送 ↑</button></div></form><div class="hint">Enter 发送 · Shift + Enter 换行<span>最多 8 轮决策</span></div></footer></main><aside class="inspector"><h2>执行观察</h2><p class="muted">理解 Agent 的每一步行动</p><h3>可用工具</h3><div id="tools"></div><h3>本次执行</h3><div id="trace" class="empty">发送任务后，查看决策与工具结果。</div><h3>会话待办 <span id="count">0</span></h3><div id="todos" class="empty">暂无待办</div><details id="memory"><summary>上下文摘要</summary><pre id="summary">暂无压缩历史</pre></details></aside></div><script src="/app.js" defer></script></body></html>
